<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPUCT - GPU Container Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .header p {
            color: #6b7280;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[readonly] {
            background-color: #f9fafb;
            cursor: not-allowed;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .info-text {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 4px;
        }

        .success-message,
        .error-message {
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            display: none;
        }

        .success-message {
            background-color: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }

        .error-message {
            background-color: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .success-message.show,
        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GPUCT</h1>
            <p>GPU Container Tool - Create Your Container</p>
        </div>

        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>

        <form id="containerForm">
            <div class="form-group">
                <label for="studentName">Student Name *</label>
                <input type="text" id="studentName" name="studentName" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="student@example.com">
            </div>

            <div class="form-group">
                <label for="purpose">Purpose *</label>
                <textarea id="purpose" name="purpose" required placeholder="Describe the purpose of this container..."></textarea>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="storage">Storage Requirement</label>
                    <input type="text" id="storage" name="storage" value="50GB" placeholder="50GB">
                    <div class="info-text">Default: 50GB</div>
                </div>

                <div class="form-group">
                    <label for="ram">RAM Requirement</label>
                    <input type="text" id="ram" name="ram" value="4GB" placeholder="4GB">
                    <div class="info-text">Default: 4GB</div>
                </div>
            </div>

            <div class="form-group">
                <label for="gpuVram">GPU VRAM Requirement *</label>
                <input type="text" id="gpuVram" name="gpuVram" required placeholder="e.g., 8GB, 16GB, 24GB">
            </div>

            <div class="form-group">
                <label for="linuxUsername">Linux Username</label>
                <input type="text" id="linuxUsername" name="linuxUsername" readonly placeholder="Auto-generated">
                <div class="info-text">Auto-filled based on email and student name</div>
            </div>

            <div class="form-group">
                <label for="containerName">Container Name</label>
                <input type="text" id="containerName" name="containerName" readonly placeholder="Auto-generated">
                <div class="info-text">Auto-generated based on student email</div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="timeNeeded">Time Needed (days)</label>
                    <input type="number" id="timeNeeded" name="timeNeeded" value="7" min="1" max="365">
                    <div class="info-text">Default: 7 days</div>
                </div>

                <div class="form-group">
                    <label for="freezeAfter">Freeze After (days)</label>
                    <input type="number" id="freezeAfter" name="freezeAfter" readonly>
                    <div class="info-text">Time + freeze period</div>
                </div>
            </div>

            <div class="form-group">
                <label for="deleteAfter">Delete After (days)</label>
                <input type="number" id="deleteAfter" name="deleteAfter" value="30" min="1">
                <div class="info-text">Default: 30 days after time ends</div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="sendCreds" name="sendCreds" checked>
                <label for="sendCreds">Send credentials to email</label>
            </div>

            <div class="form-group" id="emailFieldGroup">
                <label for="credEmail">Credentials Email</label>
                <input type="email" id="credEmail" name="credEmail" placeholder="Same as student email">
                <div class="info-text">Defaults to student email if empty</div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Create Container
            </button>
        </form>
    </div>

    <script>
        // Auto-generate username from email and name
        function generateUsername() {
            const email = document.getElementById('email').value;
            const name = document.getElementById('studentName').value;
            
            if (email && name) {
                // Extract first part of email
                const emailPrefix = email.split('@')[0];
                // Get first name
                const firstName = name.split(' ')[0].toLowerCase();
                // Combine and sanitize
                const username = (firstName + emailPrefix.substring(0, 5))
                    .toLowerCase()
                    .replace(/[^a-z0-9]/g, '')
                    .substring(0, 16);
                
                document.getElementById('linuxUsername').value = username;
            }
        }

        // Auto-generate container name from email
        function generateContainerName() {
            const email = document.getElementById('email').value;
            
            if (email) {
                const emailPrefix = email.split('@')[0];
                const timestamp = Date.now();
                const containerName = `${emailPrefix.toLowerCase().replace(/[^a-z0-9]/g, '')}-${timestamp}`;
                
                document.getElementById('containerName').value = containerName;
            }
        }

        // Calculate freeze after days
        function calculateFreezeAfter() {
            const timeNeeded = parseInt(document.getElementById('timeNeeded').value) || 7;
            const freezeAfter = timeNeeded + 7; // 7 days grace period
            document.getElementById('freezeAfter').value = freezeAfter;
        }

        // Event listeners for auto-generation
        document.getElementById('email').addEventListener('input', () => {
            generateUsername();
            generateContainerName();
            // Auto-fill credentials email
            if (document.getElementById('sendCreds').checked) {
                document.getElementById('credEmail').value = document.getElementById('email').value;
            }
        });

        document.getElementById('studentName').addEventListener('input', generateUsername);
        document.getElementById('timeNeeded').addEventListener('input', calculateFreezeAfter);

        // Handle send credentials checkbox
        document.getElementById('sendCreds').addEventListener('change', (e) => {
            const emailField = document.getElementById('credEmail');
            if (e.target.checked) {
                emailField.value = document.getElementById('email').value;
            }
        });

        // Initialize freeze after on page load
        calculateFreezeAfter();

        // Form submission
        document.getElementById('containerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            // Hide previous messages
            successMsg.classList.remove('show');
            errorMsg.classList.remove('show');
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Creating Container...';
            
            // Gather form data
            const formData = {
                student_name: document.getElementById('studentName').value,
                email: document.getElementById('email').value,
                purpose: document.getElementById('purpose').value,
                storage: document.getElementById('storage').value,
                ram: document.getElementById('ram').value,
                gpu_vram: document.getElementById('gpuVram').value,
                username: document.getElementById('linuxUsername').value,
                container_name: document.getElementById('containerName').value,
                days_to_live: parseInt(document.getElementById('timeNeeded').value),
                freeze_after_days: parseInt(document.getElementById('freezeAfter').value),
                delete_after_days: parseInt(document.getElementById('deleteAfter').value),
                send_credentials: document.getElementById('sendCreds').checked,
                credentials_email: document.getElementById('credEmail').value || document.getElementById('email').value
            };
            
            try {
                // API endpoint - adjust this to your actual endpoint
                const response = await fetch('/api/containers/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    successMsg.textContent = `✓ Container created successfully! Container name: ${formData.container_name}`;
                    successMsg.classList.add('show');
                    
                    // Reset form after 2 seconds
                    setTimeout(() => {
                        document.getElementById('containerForm').reset();
                        calculateFreezeAfter();
                        successMsg.classList.remove('show');
                    }, 3000);
                } else {
                    throw new Error(result.message || 'Failed to create container');
                }
            } catch (error) {
                errorMsg.textContent = `✗ Error: ${error.message}`;
                errorMsg.classList.add('show');
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Create Container';
            }
        });
    </script>
</body>
</html>
